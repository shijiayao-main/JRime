name: Build
on:
  workflow_dispatch:

env:
  CI_NAME: Build CI
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - macos-26
          - macos-26-intel
          - windows-2025
    env:
      BUILD_ABI: armeabi-v7a,arm64-v8a,x86,x86_64
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get branch name
        id: vars
        shell: bash
        run: |
          echo ${GITHUB_REF#refs/*/}
          echo CI_BRANCH=${GITHUB_REF#refs/*/} >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools cmake;4.1.2'

      - name: Cache the Boost tarball (the host precompile downloads it when missing)
        uses: actions/cache@v6
        with:
          path: app/src/main/jni/boost-1.92.0.tar.xz
          # bump the key together with BOOST_VERSION in app/src/main/jni/host/CMakeLists.txt
          key: boost-1.92.0

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ matrix.os }}-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Build debug JRime
        run: |
          make debug

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        shell: bash
        run: cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: jrime-${{ matrix.os }}
          path: app/build/outputs/apk/debug/
          # keep 90 days
          retention-days: 90

      - name: Upload APK artifact (ARM64_V8A only)
        uses: actions/upload-artifact@v7
        with:
          name: jrime-arm64-v8a-${{ matrix.os }}
          path: app/build/outputs/apk/debug/*arm64-v8a-*.apk
          # keep 90 days
          retention-days: 90
