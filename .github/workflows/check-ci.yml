name: Code Checks

on:
  workflow_call:

env:
  CI_NAME: Code Checks

jobs:
  lint-and-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Pin clang-format 22.1.8 (the version the Makefile targets)
        run: |
          python3 -m venv /tmp/clangfmt
          /tmp/clangfmt/bin/pip install --quiet clang-format==22.1.8
          echo /tmp/clangfmt/bin >> "$GITHUB_PATH"

      - name: Cache the Boost tarball (the host precompile downloads it when missing)
        uses: actions/cache@v6
        with:
          path: app/src/main/jni/boost-1.92.0.tar.xz
          key: boost-1.92.0

      - name: Check code style
        run: make style-lint

      - name: Run unit tests and lint
        run: make check
